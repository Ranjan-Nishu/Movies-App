<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Bootstrap CSS CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./src/movies.js"></script>
</head>
<body class="container-fluid">
  <div id="buttonContainer">
    <button data-bs-target="#booking" data-bs-toggle="modal" class="btn btn-primary mt-4">Quick Booking</button>
  </div>
  <div class="modal fade" id="booking">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
           <h4 id="lblBooking">Quick Booking</h4>
           <button class="btn btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex p-2 justify-content-between">
            <div>
              <select class="form-select" id="lstMovies">
                <option>Select Movie</option>
                <option>The Princess Diaries</option>
                <option>PAW Dino</option>
                <option>MINIONS AND MONSTERS</option>
                <option>Desinity Movie</option>
                <option>Spider Man</option>

              </select>
            </div>

            <div>
              <select class="form-select" id="lstDate">
                <option>Select Date</option>
                <option>Today,24 Aug</option>
                <option>Monday,28 Aug</option>
                <option>Tomorrow,25 Aug</option>
                <option>Yesterday,23 Aug </option>
                <option>Today,24 Aug</option>

              </select>
            </div>

            <div>
              <select class="form-select" id="lstCinema">
                <option>Select Cinema</option>
                <option>PVR - AmeerPet</option>
                <option>INOX - B'hills</option>
                <option>PVR - Hyderabad</option>
                <option>INOX - Jublihills</option>
                <option>PVR - HITech City</option>

              </select>
            </div>

            <div>
              <select class="form-select" id="lstTiming">
                <option>Select Timing</option>
                <option>10:30 AM</option>
                <option>12:00 PM</option>
                <option>4:20 AM</option>
                <option>1:50 PM</option>
                <option>11:30 AM</option>
              </select>
            </div>
            <div>
              <button onclick="BookClick()" id="btnBook" data-bs-dismiss="modal" class="btn btn-primary ">Book</button>
            </div>  
          </div>

        </div>
           
      </div>

    </div>

  </div>
   
  <div class="w-25" id="summaryContainer" style="display:none">
    <h3 class="bi bi-ticket-detailed">Booking Summary</h3>
    <img width="100%" id="imgPoster" height="200">
    <dl class="row mt-2">
        <dt class="col-3">Movie</dt>
        <dd class="col-9" id="lblMovie"></dd>
        <dt class="col-3">Date</dt>
        <dd class="col-9" id="lblDate"></dd>
        <dt class="col-3">Cinema</dt>
        <dd class="col-9" id="lblCinema"></dd>
        <dt class="col-3">Timing</dt>
        <dd class="col-9" id="lblTiming"></dd>
    </dl>
    <button onclick="ModifyClick()" data-bs-target="#booking" data-bs-toggle="modal" class="btn btn-warning w-100">Modify Booking</button>
    <a href="./movies.html" class="btn m-2 btn-danger w-100"> Cancel Booking</a>
  </div>
</body>
</html>
